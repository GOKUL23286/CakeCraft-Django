{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>
</head>
<body>

<h1>📦 My Orders</h1>

{% for order in orders %}

<div style="border:1px solid black;padding:15px;margin:15px;">

<h3>{{ order.customer_name }}</h3>

<p>📞 {{ order.phone }}</p>

<p>🏠 {{ order.address }}</p>

<p>💰 ₹{{ order.total }}</p>

</div>

{% empty %}

<h2>No Orders Found</h2>

{% endfor %}

</body>
</html>
{% endblock %}
