{% extends 'base.html' %}

{% block content %}

<div class="row">

    <div class="col-md-6">

        {% if product.image %}
        <img src="{{ product.image.url }}" class="img-fluid rounded shadow">
        {% endif %}

    </div>

    <div class="col-md-6">

        <h2>{{ product.name }}</h2>

        <p>{{ product.description }}</p>

        <h3 class="text-success">₹{{ product.price }}</h3>

        <p><b>Category:</b> {{ product.category }}</p>

        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success">
            🛒 Add to Cart
        </a>

        <a href="/" class="btn btn-secondary">
            ⬅ Back
        </a>

    </div>

</div>

{% endblock %}
