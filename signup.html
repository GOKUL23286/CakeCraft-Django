<!DOCTYPE html>
<html>

<head>

    <title>Signup | ChocoCraft</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <div class="contact-container">


        <form class="contact-form" onsubmit="signupUser(event)"><input type="tel" id="signupPhone" placeholder="Phone Number" required>


            <h2>Create Account 🍫</h2>


            <input type="text" id="signupName" placeholder="Full Name" required>


            <input type="email" id="signupEmail" placeholder="Email" required>


            <input type="password" id="signupPassword" placeholder="Password" required>



            <button type="submit">

Signup

</button>


        </form>


    </div>



    <script src="js/script.js"></script>


</body>

</html>
<li id="loginLink">

    <a href="login.html">
Login 🔐
</a>

</li>


<li id="userBox" style="display:none;">

    <span id="userName">

</span>

</li>


<li id="logoutLink" style="display:none;">

    <a href="#" onclick="logoutUser()">

Logout 🚪

</a>

</li>
<form method="post">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username"><br><br>

    <input type="password" name="password" placeholder="Password"><br><br>

    <button>Signup</button>

</form>
